name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $ts  = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $ts  -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path $tcp -Name UserAuthentication -Value 1   # NLA activado
          Set-ItemProperty -Path $tcp -Name SecurityLayer      -Value 2   # TLS

          # Rendimiento: H.264/AVC444 y codificación por hardware si existe, sin fondo de pantalla
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $pol -Force | Out-Null
          Set-ItemProperty -Path $pol -Name AVC444ModePreferred       -Value 1 -Type DWord
          Set-ItemProperty -Path $pol -Name AVCHardwareEncodePreferred -Value 1 -Type DWord
          Set-ItemProperty -Path $pol -Name fDisableWallpaper         -Value 1 -Type DWord

          # Firewall: solo desde la red de Tailscale (100.64.0.0/10)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $sec -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=$env:TS_AUTHKEY --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $ip = $null
          for ($i = 0; $i -lt 10 -and -not $ip; $i++) {
            Start-Sleep -Seconds 5
            $ip = & $ts ip -4 | Select-Object -First 1
          }
          if (-not $ip) { Write-Error "Tailscale no asignó IP"; exit 1 }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify and keep alive
        shell: pwsh
        run: |
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) { Write-Error "RDP no responde"; exit 1 }

          Write-Host "=== RDP LISTO ==="
          Write-Host "Dirección: $env:TAILSCALE_IP"
          Write-Host "Usuario:   RDP"
          Write-Host "Contraseña: la que guardaste en el secret RDP_PASSWORD"

          while ($true) {
            Write-Host "[$(Get-Date)] activo"
            Start-Sleep -Seconds 300
          }
